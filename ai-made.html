<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Studio</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --bg-2: #0f1420;
        --panel: rgba(15, 23, 42, 0.8);
        --line: rgba(148, 163, 184, 0.15);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --purple: #8b5cf6;
        --cyan: #22d3ee;
        --green: #34d399;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", monospace;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
        overflow: hidden;
      }

      body {
        display: flex;
        align-items: stretch;
        justify-content: stretch;
      }

      .studio {
        display: grid;
        grid-template-rows: 52px minmax(0, 1fr) 122px;
        width: 100vw;
        height: 100vh;
        background: var(--panel);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        display: grid;
        place-items: center;
        color: white;
        font-size: 0.7rem;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(200px, 240px);
        gap: 1px;
        min-height: 0;
        background: var(--line);
      }

      .sidebar, .inspector {
        background: rgba(15, 23, 42, 0.82);
        overflow-y: auto;
        padding: 16px;
        min-height: 0;
      }

      .inspector {
        border-left: 1px solid var(--line);
      }

      .canvas-area {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 0;
        background: rgba(17, 24, 39, 0.7);
      }

      .canvas-viewport {
        position: relative;
        min-height: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(20, 28, 44, 0.8));
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
      }

      .panel-title {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px 0;
        font-weight: 700;
      }

      .section {
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: none;
      }

      label {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="number"],
      input[type="range"],
      input[type="color"],
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.06);
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }

      input[type="range"] {
        accent-color: var(--purple);
      }

      button {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--text);
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        transition: 0.15s ease;
        width: 100%;
        margin-bottom: 8px;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(139, 92, 246, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      button.secondary {
        background: rgba(52, 211, 153, 0.08);
        border-color: rgba(52, 211, 153, 0.2);
      }

      .guide {
        background: rgba(34, 211, 238, 0.06);
        border: 1px solid rgba(34, 211, 238, 0.15);
        border-radius: 8px;
        padding: 10px;
        font-size: 0.75rem;
        line-height: 1.5;
        color: #bae6fd;
        margin-bottom: 12px;
      }

      .guide-title {
        font-weight: 700;
        color: var(--cyan);
        margin-bottom: 6px;
      }

      .timeline {
        background: rgba(15, 23, 42, 0.9);
        border-top: 1px solid var(--line);
        padding: 12px;
        min-height: 0;
      }

      .timeline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .timeline-controls {
        display: flex;
        gap: 8px;
      }

      .play-btn {
        width: 32px !important;
        height: 32px !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 0.7rem;
      }

      .timeline-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .timeline-label {
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0;
        white-space: nowrap;
      }

      .timeline-bar {
        flex: 1;
        height: 4px;
        background: rgba(148, 163, 184, 0.12);
        border-radius: 2px;
        position: relative;
        cursor: pointer;
      }

      .timeline-progress {
        height: 100%;
        background: linear-gradient(90deg, var(--purple), var(--cyan));
        border-radius: 2px;
        width: 0%;
      }

      .keyframe-strip {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .keyframe {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: rgba(139, 92, 246, 0.18);
        color: var(--text);
        font-size: 0.6rem;
        display: grid;
        place-items: center;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }

      .keyframe.active {
        background: var(--purple);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
      }

      .value-box {
        padding: 8px 10px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .value-box strong {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 2px;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(148, 163, 184, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 4px;
      }

      @media (max-width: 980px) {
        html, body {
          overflow: auto;
        }

        .studio {
          grid-template-rows: 52px minmax(0, 1fr) auto;
          height: auto;
          min-height: 100vh;
        }

        .workspace {
          display: block;
        }

        .sidebar, .inspector {
          width: 100%;
          border-left: none;
          border-bottom: 1px solid var(--line);
        }

        .canvas-area {
          min-height: 420px;
          height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="studio">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">▶</div>
          <span>Animation Studio</span>
        </div>
        <div class="topbar-right">
          <span class="status-dot"></span>
          <span>Ready to animate</span>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <h3 class="panel-title">Shape</h3>

          <div class="section">
            <label>Type</label>
            <select id="shapeType">
              <option value="square">Square</option>
              <option value="circle">Circle</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>

          <div class="section">
            <label>Color</label>
            <input type="color" id="colorInput" value="#8b5cf6" />
          </div>

          <h3 class="panel-title" style="margin-top: 18px;">How to Animate</h3>
          <div class="guide">
            <div class="guide-title">Step by step:</div>
            <div>
              1. Move frame slider<br/>
              2. Adjust position/size<br/>
              3. Click “Set Keyframe”<br/>
              4. Move to next frame<br/>
              5. Press PLAY
            </div>
          </div>

          <button class="secondary" id="clearAnimBtn">Clear All</button>
        </aside>

        <div class="canvas-area">
          <div class="canvas-viewport">
            <canvas id="canvas"></canvas>
          </div>

          <div class="timeline">
            <div class="timeline-header">
              <h3 class="panel-title">Timeline</h3>
              <div class="timeline-controls">
                <button class="play-btn" id="playBtn">▶</button>
                <button class="play-btn" id="stopBtn">⏹</button>
              </div>
            </div>

            <div class="timeline-row">
              <label class="timeline-label">Frame: <span id="frameDisplay">0</span> / 60</label>
              <div class="timeline-bar" id="timelineBar">
                <div class="timeline-progress" id="timelineProgress"></div>
              </div>
            </div>

            <div style="margin-top: 8px;">
              <input type="range" id="frameSlider" min="0" max="60" value="0" />
            </div>

            <div class="keyframe-strip" id="keyframeStrip"></div>
          </div>
        </div>

        <aside class="inspector">
          <h3 class="panel-title">Properties</h3>

          <div class="section">
            <label>Position X</label>
            <input type="range" id="posX" min="0" max="800" value="400" />
            <div class="value-box"><strong id="posXValue">400</strong>px</div>
          </div>

          <div class="section">
            <label>Position Y</label>
            <input type="range" id="posY" min="0" max="400" value="200" />
            <div class="value-box"><strong id="posYValue">200</strong>px</div>
          </div>

          <div class="section">
            <label>Size</label>
            <input type="range" id="size" min="10" max="200" value="60" />
            <div class="value-box"><strong id="sizeValue">60</strong>px</div>
          </div>

          <div class="section">
            <label>Rotation</label>
            <input type="range" id="rotation" min="0" max="360" value="0" />
            <div class="value-box"><strong id="rotationValue">0</strong>°</div>
          </div>

          <div class="section">
            <label>Opacity</label>
            <input type="range" id="opacity" min="0" max="100" value="100" />
            <div class="value-box"><strong id="opacityValue">100</strong>%</div>
          </div>

          <button class="secondary" id="setKeyframeBtn">📌 Set Keyframe</button>
        </aside>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = Math.max(300, rect.width);
        canvas.height = Math.max(220, rect.height);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let isPlaying = false;
      let currentFrame = 0;
      let totalFrames = 60;
      let animationSpeed = 50;

      let object = {
        shapeType: 'square',
        color: '#8b5cf6',
        keyframes: {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 },
          30: { x: 220, y: 140, size: 100, rotation: 180, opacity: 100 },
          60: { x: 400, y: 200, size: 60, rotation: 360, opacity: 100 }
        }
      };

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function getState(frame) {
        const frames = Object.keys(object.keyframes)
          .map(Number)
          .sort((a, b) => a - b);

        let before = frames[0];
        let after = frames[frames.length - 1];

        for (let i = 0; i < frames.length - 1; i++) {
          if (frame >= frames[i] && frame <= frames[i + 1]) {
            before = frames[i];
            after = frames[i + 1];
            break;
          }
        }

        if (before === after) {
          return object.keyframes[before];
        }

        const t = (frame - before) / (after - before);
        const k1 = object.keyframes[before];
        const k2 = object.keyframes[after];

        return {
          x: lerp(k1.x, k2.x, t),
          y: lerp(k1.y, k2.y, t),
          size: lerp(k1.size, k2.size, t),
          rotation: lerp(k1.rotation, k2.rotation, t),
          opacity: lerp(k1.opacity, k2.opacity, t)
        };
      }

      function drawShape(x, y, size, rotation, opacity, type, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.globalAlpha = opacity / 100;
        ctx.fillStyle = color;

        if (type === 'square') {
          ctx.fillRect(-size / 2, -size / 2, size, size);
        } else if (type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (type === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -size / 2);
          ctx.lineTo(size / 2, size / 2);
          ctx.lineTo(-size / 2, size / 2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const state = getState(currentFrame);
        drawShape(state.x, state.y, state.size, state.rotation, state.opacity, object.shapeType, object.color);
      }

      function updateDisplay() {
        document.getElementById('frameDisplay').textContent = currentFrame;
        document.getElementById('frameSlider').value = currentFrame;
        document.getElementById('timelineProgress').style.width = (currentFrame / totalFrames) * 100 + '%';

        const state = getState(currentFrame);
        document.getElementById('posXValue').textContent = Math.round(state.x);
        document.getElementById('posYValue').textContent = Math.round(state.y);
        document.getElementById('sizeValue').textContent = Math.round(state.size);
        document.getElementById('rotationValue').textContent = Math.round(state.rotation);
        document.getElementById('opacityValue').textContent = Math.round(state.opacity);

        document.getElementById('posX').value = Math.round(state.x);
        document.getElementById('posY').value = Math.round(state.y);
        document.getElementById('size').value = Math.round(state.size);
        document.getElementById('rotation').value = Math.round(state.rotation);
        document.getElementById('opacity').value = Math.round(state.opacity);
      }

      function renderKeyframes() {
        const strip = document.getElementById('keyframeStrip');
        strip.innerHTML = '';

        for (let i = 0; i <= totalFrames; i += 5) {
          const btn = document.createElement('button');
          btn.className = 'keyframe' + (object.keyframes[i] ? ' active' : '');
          btn.textContent = i;
          btn.type = 'button';
          btn.onclick = () => {
            currentFrame = i;
            updateDisplay();
            draw();
          };
          strip.appendChild(btn);
        }
      }

      function animationLoop() {
        draw();

        if (isPlaying) {
          currentFrame += 1;
          if (currentFrame > totalFrames) {
            currentFrame = 0;
          }
          updateDisplay();
          setTimeout(animationLoop, animationSpeed);
        }
      }

      document.getElementById('playBtn').addEventListener('click', (e) => {
        e.preventDefault();
        isPlaying = true;
        animationLoop();
      });

      document.getElementById('stopBtn').addEventListener('click', (e) => {
        e.preventDefault();
        isPlaying = false;
        currentFrame = 0;
        updateDisplay();
        draw();
      });

      document.getElementById('frameSlider').addEventListener('input', (e) => {
        currentFrame = Number(e.target.value);
        updateDisplay();
        draw();
      });

      document.getElementById('timelineBar').addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        currentFrame = Math.round(percent * totalFrames);
        updateDisplay();
        draw();
      });

      document.getElementById('setKeyframeBtn').addEventListener('click', (e) => {
        e.preventDefault();
        object.keyframes[currentFrame] = {
          x: Number(document.getElementById('posX').value),
          y: Number(document.getElementById('posY').value),
          size: Number(document.getElementById('size').value),
          rotation: Number(document.getElementById('rotation').value),
          opacity: Number(document.getElementById('opacity').value)
        };
        renderKeyframes();
        draw();
      });

      document.getElementById('clearAnimBtn').addEventListener('click', (e) => {
        e.preventDefault();
        object.keyframes = {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 }
        };
        currentFrame = 0;
        isPlaying = false;
        renderKeyframes();
        updateDisplay();
        draw();
      });

      document.getElementById('shapeType').addEventListener('change', (e) => {
        object.shapeType = e.target.value;
        draw();
      });

      document.getElementById('colorInput').addEventListener('input', (e) => {
        object.color = e.target.value;
        draw();
      });

      document.getElementById('posX').addEventListener('input', (e) => {
        document.getElementById('posXValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('posY').addEventListener('input', (e) => {
        document.getElementById('posYValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('size').addEventListener('input', (e) => {
        document.getElementById('sizeValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('rotation').addEventListener('input', (e) => {
        document.getElementById('rotationValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('opacity').addEventListener('input', (e) => {
        document.getElementById('opacityValue').textContent = e.target.value;
        draw();
      });

      renderKeyframes();
      updateDisplay();
      draw();
    </script>
  </body>
</html>
