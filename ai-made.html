<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Studio</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --bg-2: #0f1420;
        --panel: rgba(15, 23, 42, 0.8);
        --line: rgba(148, 163, 184, 0.15);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --purple: #8b5cf6;
        --cyan: #22d3ee;
        --green: #34d399;
        --red: #ef4444;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-height: 100vh;
        font-family: Inter, "Segoe UI", monospace;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
        overflow: auto;
      }

      body {
        display: flex;
      }

      .studio {
        display: grid;
        grid-template-rows: 52px minmax(0, 1fr) auto;
        width: 100vw;
        height: 100vh;
        background: var(--panel);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: rgba(15, 23, 42, 0.9);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        display: grid;
        place-items: center;
        color: white;
        font-size: 0.7rem;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 12px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
      }

      .workspace {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(200px, 240px);
        gap: 1px;
        min-height: 0;
        background: var(--line);
      }

      .sidebar, .inspector {
        background: rgba(15, 23, 42, 0.82);
        overflow-y: auto;
        padding: 16px;
        min-height: 0;
      }

      .inspector {
        border-left: 1px solid var(--line);
      }

      .canvas-area {
        display: grid;
        grid-template-rows: minmax(0, 1fr) auto;
        min-height: 0;
        background: rgba(17, 24, 39, 0.7);
      }

      .canvas-viewport {
        position: relative;
        min-height: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background:
          linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
          linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(20, 28, 44, 0.8));
        background-size: 24px 24px, 24px 24px, 100% 100%;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        border: none;
        outline: none;
      }

      .game-container {
        display: none;
        width: 100%;
        height: 100%;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        position: fixed;
        top: 0;
        left: 0;
        z-index: 500;
      }

      .game-container.active {
        display: flex;
      }

      .game-content {
        text-align: center;
        padding: 20px;
        max-width: 90vw;
      }

      .game-title {
        font-size: 2.5rem;
        font-weight: 700;
        margin-bottom: 10px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .game-area {
        background: rgba(15, 23, 42, 0.9);
        border: 2px solid var(--purple);
        border-radius: 16px;
        padding: 30px;
        width: 100%;
        max-width: 600px;
        margin: 20px 0;
        min-height: 300px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .game-score {
        font-size: 1.5rem;
        color: var(--cyan);
        margin-bottom: 20px;
      }

      .back-btn {
        padding: 12px 24px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--text);
        font-weight: 600;
        font-size: 0.9rem;
        cursor: pointer;
        transition: 0.15s ease;
        margin-top: 20px;
      }

      .back-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(139, 92, 246, 0.2);
      }

      .snake-grid {
        display: grid;
        grid-template-columns: repeat(10, 30px);
        gap: 2px;
        margin: 0 auto;
      }

      .snake-cell {
        width: 30px;
        height: 30px;
        background: rgba(148, 163, 184, 0.2);
        border-radius: 4px;
        border: 1px solid var(--line);
      }

      .snake-cell.snake {
        background: var(--green);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.6);
      }

      .snake-cell.food {
        background: var(--red);
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      }

      .memory-grid {
        display: grid;
        grid-template-columns: repeat(4, 80px);
        gap: 10px;
        margin: 0 auto;
      }

      .memory-card {
        width: 80px;
        height: 80px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 2rem;
        font-weight: 700;
        transition: all 0.15s ease;
        display: grid;
        place-items: center;
      }

      .memory-card:hover {
        transform: scale(1.05);
        box-shadow: 0 8px 16px rgba(139, 92, 246, 0.4);
      }

      .memory-card.flipped {
        background: rgba(139, 92, 246, 0.3);
      }

      .flappy-bird {
        position: relative;
        width: 100px;
        height: 100px;
        margin: 0 auto;
        background: var(--cyan);
        border-radius: 50%;
        box-shadow: 0 0 20px rgba(34, 211, 238, 0.8);
      }

      .pipe {
        position: absolute;
        background: var(--green);
        width: 60px;
        box-shadow: 0 0 15px rgba(52, 211, 153, 0.6);
      }

      .panel-title {
        font-size: 0.72rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px 0;
        font-weight: 700;
      }

      .section {
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: none;
      }

      label {
        display: block;
        font-size: 0.72rem;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      input[type="text"],
      input[type="number"],
      input[type="range"],
      input[type="color"],
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.06);
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }

      input[type="range"] {
        accent-color: var(--purple);
      }

      button {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--text);
        font-weight: 600;
        font-size: 0.78rem;
        cursor: pointer;
        transition: 0.15s ease;
        width: 100%;
        margin-bottom: 8px;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(139, 92, 246, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      button.secondary {
        background: rgba(52, 211, 153, 0.08);
        border-color: rgba(52, 211, 153, 0.2);
      }

      button.tertiary {
        background: rgba(34, 211, 238, 0.08);
        border-color: rgba(34, 211, 238, 0.2);
      }

      .guide {
        background: rgba(34, 211, 238, 0.06);
        border: 1px solid rgba(34, 211, 238, 0.15);
        border-radius: 8px;
        padding: 10px;
        font-size: 0.75rem;
        line-height: 1.5;
        color: #bae6fd;
        margin-bottom: 12px;
      }

      .guide-title {
        font-weight: 700;
        color: var(--cyan);
        margin-bottom: 6px;
      }

      .lesson-box {
        background: rgba(139, 92, 246, 0.08);
        border: 1px solid rgba(139, 92, 246, 0.18);
        border-radius: 8px;
        padding: 10px;
        margin-bottom: 12px;
      }

      .lesson-box strong {
        display: block;
        font-size: 0.75rem;
        color: #ddd6fe;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin-bottom: 6px;
      }

      .timeline {
        background: rgba(15, 23, 42, 0.9);
        border-top: 1px solid var(--line);
        padding: 12px;
        min-height: 0;
        max-height: 180px;
      }

      .timeline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .timeline-controls {
        display: flex;
        gap: 8px;
      }

      .play-btn {
        width: 32px !important;
        height: 32px !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 0.7rem;
      }

      .timeline-row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-top: 8px;
      }

      .timeline-label {
        font-size: 0.72rem;
        color: var(--muted);
        margin: 0;
        white-space: nowrap;
      }

      .timeline-bar {
        flex: 1;
        height: 4px;
        background: rgba(148, 163, 184, 0.12);
        border-radius: 2px;
        position: relative;
        cursor: pointer;
      }

      .timeline-progress {
        height: 100%;
        background: linear-gradient(90deg, var(--purple), var(--cyan));
        border-radius: 2px;
        width: 0%;
      }

      .keyframe-strip {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .keyframe {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        border: 1px solid var(--line);
        background: rgba(139, 92, 246, 0.18);
        color: var(--text);
        font-size: 0.6rem;
        display: grid;
        place-items: center;
        padding: 0;
        margin: 0;
        cursor: pointer;
      }

      .keyframe.active {
        background: var(--purple);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.5);
      }

      .value-box {
        padding: 8px 10px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 6px;
      }

      .value-box strong {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 2px;
      }

      .menu-overlay {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        z-index: 400;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .menu-overlay.active {
        display: flex;
      }

      .menu-content {
        text-align: center;
      }

      .menu-title {
        font-size: 3rem;
        font-weight: 700;
        margin-bottom: 30px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .menu-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        max-width: 700px;
        margin: 0 auto 30px;
      }

      .menu-btn {
        padding: 30px 20px;
        border: 2px solid var(--purple);
        border-radius: 12px;
        background: rgba(139, 92, 246, 0.1);
        color: var(--text);
        font-weight: 700;
        font-size: 1.1rem;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        width: 100%;
        margin: 0;
      }

      .menu-btn:hover {
        transform: scale(1.08);
        background: rgba(139, 92, 246, 0.2);
        box-shadow: 0 8px 25px rgba(139, 92, 246, 0.3);
        border-color: var(--cyan);
      }

      .menu-icon {
        font-size: 2.5rem;
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(148, 163, 184, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 4px;
      }

      @media (max-width: 980px) {
        html, body {
          overflow: visible;
        }

        .studio {
          grid-template-rows: 52px minmax(0, 1fr) auto;
          height: auto;
          min-height: 100vh;
        }

        .workspace {
          display: block;
        }

        .sidebar, .inspector {
          width: 100%;
          border-left: none;
          border-bottom: 1px solid var(--line);
        }

        .canvas-area {
          min-height: 420px;
          height: 420px;
        }
      }
    </style>
  </head>
  <body>
    <div class="menu-overlay" id="menuOverlay">
      <div class="menu-content">
        <h1 class="menu-title">🎮 Play Games</h1>
        <div class="menu-grid" id="menuGrid"></div>
        <button class="back-btn" id="menuBackBtn">← Back to Studio</button>
      </div>
    </div>

    <div class="game-container" id="gameContainer">
      <div class="game-content">
        <h2 class="game-title" id="gameTitle">Game</h2>
        <div class="game-score" id="gameScore">Score: 0</div>
        <div class="game-area" id="gameArea"></div>
        <button class="back-btn" id="gameBackBtn">← Back to Studio</button>
      </div>
    </div>

    <div class="studio">
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">▶</div>
          <span>Animation Studio</span>
        </div>
        <div class="topbar-right">
          <span class="status-dot"></span>
          <span id="topbarStatus">Ready to animate</span>
        </div>
      </header>

      <div class="workspace">
        <aside class="sidebar">
          <h3 class="panel-title">Lessons</h3>

          <div class="lesson-box">
            <strong>Beginner</strong>
            <button type="button" data-preset="bounce">Bounce</button>
            <button type="button" data-preset="fade">Fade</button>
            <button type="button" data-preset="orbit">Orbit</button>
          </div>

          <div class="section">
            <label>Shape</label>
            <select id="shapeType">
              <option value="square">Square</option>
              <option value="circle">Circle</option>
              <option value="triangle">Triangle</option>
            </select>
          </div>

          <div class="section">
            <label>Color</label>
            <input type="color" id="colorInput" value="#8b5cf6" />
          </div>

          <div class="section">
            <label>Frame Count</label>
            <input id="frameCountInput" type="number" min="12" max="240" step="1" value="60" />
          </div>

          <div class="section">
            <label>Frame Speed (ms)</label>
            <input id="speedInput" type="number" min="10" max="200" step="5" value="60" />
          </div>

          <button id="applyTimingBtn" type="button">Apply Timing</button>

          <h3 class="panel-title" style="margin-top: 18px;">How to Animate</h3>
          <div class="guide">
            <div class="guide-title">Step by step:</div>
            <div>
              1. Move frame slider<br/>
              2. Adjust position/size<br/>
              3. Click "Set Keyframe"<br/>
              4. Move to next frame<br/>
              5. Press PLAY
            </div>
          </div>

          <button class="secondary" id="clearAnimBtn" type="button">Clear All</button>
          <button class="tertiary" id="openGamesBtn" type="button">🎮 Play Games</button>
        </aside>

        <div class="canvas-area">
          <div class="canvas-viewport">
            <canvas id="canvas"></canvas>
          </div>

          <div class="timeline">
            <div class="timeline-header">
              <h3 class="panel-title">Timeline</h3>
              <div class="timeline-controls">
                <button class="play-btn" id="playBtn" type="button">▶</button>
                <button class="play-btn" id="stopBtn" type="button">⏹</button>
              </div>
            </div>

            <div class="timeline-row">
              <label class="timeline-label">Frame: <span id="frameDisplay">0</span> / <span id="totalFrameLabel">60</span></label>
              <div class="timeline-bar" id="timelineBar">
                <div class="timeline-progress" id="timelineProgress"></div>
              </div>
            </div>

            <div style="margin-top: 8px;">
              <input type="range" id="frameSlider" min="0" max="60" value="0" />
            </div>

            <div class="keyframe-strip" id="keyframeStrip"></div>
          </div>
        </div>

        <aside class="inspector">
          <h3 class="panel-title">Properties</h3>

          <div class="section">
            <label>Position X</label>
            <input type="range" id="posX" min="0" max="800" value="400" />
            <div class="value-box"><strong id="posXValue">400</strong>px</div>
          </div>

          <div class="section">
            <label>Position Y</label>
            <input type="range" id="posY" min="0" max="400" value="200" />
            <div class="value-box"><strong id="posYValue">200</strong>px</div>
          </div>

          <div class="section">
            <label>Size</label>
            <input type="range" id="size" min="10" max="200" value="60" />
            <div class="value-box"><strong id="sizeValue">60</strong>px</div>
          </div>

          <div class="section">
            <label>Rotation</label>
            <input type="range" id="rotation" min="0" max="360" value="0" />
            <div class="value-box"><strong id="rotationValue">0</strong>°</div>
          </div>

          <div class="section">
            <label>Opacity</label>
            <input type="range" id="opacity" min="0" max="100" value="100" />
            <div class="value-box"><strong id="opacityValue">100</strong>%</div>
          </div>

          <button class="secondary" id="setKeyframeBtn" type="button">📌 Set Keyframe</button>
        </aside>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');

      const presets = {
        bounce: {
          color: '#8b5cf6',
          shapeType: 'circle',
          keyframes: {
            0: { x: 200, y: 200, size: 60, rotation: 0, opacity: 100 },
            10: { x: 200, y: 120, size: 70, rotation: 0, opacity: 100 },
            20: { x: 200, y: 200, size: 60, rotation: 0, opacity: 100 },
            30: { x: 200, y: 90, size: 80, rotation: 0, opacity: 100 },
            40: { x: 200, y: 200, size: 60, rotation: 0, opacity: 100 },
            60: { x: 200, y: 200, size: 60, rotation: 0, opacity: 100 }
          }
        },
        fade: {
          color: '#22d3ee',
          shapeType: 'square',
          keyframes: {
            0: { x: 400, y: 200, size: 80, rotation: 0, opacity: 0 },
            20: { x: 400, y: 200, size: 80, rotation: 0, opacity: 50 },
            40: { x: 400, y: 200, size: 90, rotation: 15, opacity: 100 },
            60: { x: 400, y: 200, size: 80, rotation: 0, opacity: 100 }
          }
        },
        orbit: {
          color: '#34d399',
          shapeType: 'triangle',
          keyframes: {
            0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 },
            15: { x: 540, y: 150, size: 60, rotation: 45, opacity: 100 },
            30: { x: 540, y: 260, size: 60, rotation: 90, opacity: 100 },
            45: { x: 400, y: 300, size: 60, rotation: 180, opacity: 100 },
            60: { x: 260, y: 260, size: 60, rotation: 270, opacity: 100 }
          }
        }
      };

      const games = [
        { name: 'Snake', icon: '🐍', id: 'snake' },
        { name: 'Memory Match', icon: '🧠', id: 'memory' },
        { name: 'Flappy', icon: '🚀', id: 'flappy' }
      ];

      let gameState = {
        snake: { body: [[5, 5]], direction: [1, 0], food: [8, 8], score: 0 },
        memory: { cards: [], flipped: [], matched: 0, score: 0 },
        flappy: { y: 150, vy: 0, score: 0, pipes: [] }
      };

      let currentGame = null;
      let gameRunning = false;
      let gameLoop = null;

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = Math.max(300, rect.width);
        canvas.height = Math.max(220, rect.height);
      }

      window.addEventListener('resize', resizeCanvas);
      resizeCanvas();

      let isPlaying = false;
      let currentFrame = 0;
      let totalFrames = 60;
      let animationSpeed = 60;

      let object = {
        shapeType: 'square',
        color: '#8b5cf6',
        keyframes: {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 },
          30: { x: 220, y: 140, size: 100, rotation: 180, opacity: 100 },
          60: { x: 400, y: 200, size: 60, rotation: 360, opacity: 100 }
        }
      };

      function clampFrameCount(value) {
        const frameValue = Number(value);
        if (!Number.isFinite(frameValue)) return 60;
        return Math.min(240, Math.max(12, Math.round(frameValue)));
      }

      function clampSpeed(value) {
        const speedValue = Number(value);
        if (!Number.isFinite(speedValue)) return 60;
        return Math.min(200, Math.max(10, Math.round(speedValue)));
      }

      function syncTimingInputs() {
        document.getElementById('frameCountInput').value = totalFrames;
        document.getElementById('speedInput').value = animationSpeed;
        document.getElementById('frameSlider').max = totalFrames;
        document.getElementById('totalFrameLabel').textContent = totalFrames;
      }

      function applyTiming() {
        totalFrames = clampFrameCount(document.getElementById('frameCountInput').value);
        animationSpeed = clampSpeed(document.getElementById('speedInput').value);
        currentFrame = Math.min(currentFrame, totalFrames);
        syncTimingInputs();
        updateDisplay();
        renderKeyframes();
        draw();
      }

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function getState(frame) {
        const frames = Object.keys(object.keyframes)
          .map(Number)
          .sort((a, b) => a - b);

        let before = frames[0];
        let after = frames[frames.length - 1];

        for (let i = 0; i < frames.length - 1; i++) {
          if (frame >= frames[i] && frame <= frames[i + 1]) {
            before = frames[i];
            after = frames[i + 1];
            break;
          }
        }

        if (before === after) {
          return object.keyframes[before] || { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 };
        }

        const t = (frame - before) / (after - before);
        const k1 = object.keyframes[before];
        const k2 = object.keyframes[after];

        return {
          x: lerp(k1.x, k2.x, t),
          y: lerp(k1.y, k2.y, t),
          size: lerp(k1.size, k2.size, t),
          rotation: lerp(k1.rotation, k2.rotation, t),
          opacity: lerp(k1.opacity, k2.opacity, t)
        };
      }

      function drawShape(x, y, size, rotation, opacity, type, color) {
        ctx.save();
        ctx.translate(x, y);
        ctx.rotate((rotation * Math.PI) / 180);
        ctx.globalAlpha = opacity / 100;
        ctx.fillStyle = color;

        if (type === 'square') {
          ctx.fillRect(-size / 2, -size / 2, size, size);
        } else if (type === 'circle') {
          ctx.beginPath();
          ctx.arc(0, 0, size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (type === 'triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -size / 2);
          ctx.lineTo(size / 2, size / 2);
          ctx.lineTo(-size / 2, size / 2);
          ctx.closePath();
          ctx.fill();
        }

        ctx.restore();
      }

      function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const state = getState(currentFrame);
        drawShape(state.x, state.y, state.size, state.rotation, state.opacity, object.shapeType, object.color);
      }

      function updateDisplay() {
        document.getElementById('frameDisplay').textContent = currentFrame;
        document.getElementById('frameSlider').value = currentFrame;
        document.getElementById('timelineProgress').style.width = (currentFrame / totalFrames) * 100 + '%';

        const state = getState(currentFrame);
        document.getElementById('posXValue').textContent = Math.round(state.x);
        document.getElementById('posYValue').textContent = Math.round(state.y);
        document.getElementById('sizeValue').textContent = Math.round(state.size);
        document.getElementById('rotationValue').textContent = Math.round(state.rotation);
        document.getElementById('opacityValue').textContent = Math.round(state.opacity);

        document.getElementById('posX').value = Math.round(state.x);
        document.getElementById('posY').value = Math.round(state.y);
        document.getElementById('size').value = Math.round(state.size);
        document.getElementById('rotation').value = Math.round(state.rotation);
        document.getElementById('opacity').value = Math.round(state.opacity);
      }

      function renderKeyframes() {
        const strip = document.getElementById('keyframeStrip');
        strip.innerHTML = '';

        for (let i = 0; i <= totalFrames; i += 5) {
          const btn = document.createElement('button');
          btn.className = 'keyframe' + (object.keyframes[i] ? ' active' : '');
          btn.textContent = i;
          btn.type = 'button';
          btn.onclick = () => {
            currentFrame = i;
            updateDisplay();
            draw();
          };
          strip.appendChild(btn);
        }
      }

      function animationLoop() {
        draw();

        if (isPlaying) {
          currentFrame += 1;
          if (currentFrame > totalFrames) {
            currentFrame = 0;
          }
          updateDisplay();
          setTimeout(animationLoop, animationSpeed);
        }
      }

      function applyPreset(name) {
        const preset = presets[name];
        if (!preset) return;

        object = {
          ...object,
          color: preset.color,
          shapeType: preset.shapeType,
          keyframes: JSON.parse(JSON.stringify(preset.keyframes))
        };

        document.getElementById('shapeType').value = preset.shapeType;
        document.getElementById('colorInput').value = preset.color;
        currentFrame = 0;
        isPlaying = false;
        updateDisplay();
        renderKeyframes();
        draw();
      }

      // Game Logic
      function showMenuOverlay() {
        document.getElementById('menuOverlay').classList.add('active');
        const grid = document.getElementById('menuGrid');
        grid.innerHTML = '';
        games.forEach(game => {
          const btn = document.createElement('button');
          btn.className = 'menu-btn';
          btn.innerHTML = `<div class="menu-icon">${game.icon}</div><div>${game.name}</div>`;
          btn.onclick = () => startGame(game.id);
          grid.appendChild(btn);
        });
      }

      function hideMenuOverlay() {
        document.getElementById('menuOverlay').classList.remove('active');
      }

      function showGameContainer() {
        document.getElementById('gameContainer').classList.add('active');
      }

      function hideGameContainer() {
        document.getElementById('gameContainer').classList.remove('active');
        if (gameLoop) clearInterval(gameLoop);
        gameRunning = false;
      }

      function startGame(gameId) {
        hideMenuOverlay();
        currentGame = gameId;
        showGameContainer();
        resetGame(gameId);
        runGame(gameId);
      }

      function resetGame(gameId) {
        const gameArea = document.getElementById('gameArea');
        gameArea.innerHTML = '';
        document.getElementById('gameTitle').textContent = games.find(g => g.id === gameId).name;
        document.getElementById('gameScore').textContent = 'Score: 0';

        if (gameId === 'snake') {
          gameState.snake = { body: [[5, 5]], direction: [1, 0], food: [8, 8], score: 0 };
          renderSnake();
        } else if (gameId === 'memory') {
          const symbols = ['🎵', '🎵', '🎮', '🎮', '🎨', '🎨', '🎯', '🎯', '🎪', '🎪', '🎭', '🎭', '🎬', '🎬', '🎤', '🎤'];
          gameState.memory = { cards: symbols.sort(() => Math.random() - 0.5), flipped: Array(16).fill(false), matched: 0, score: 0 };
          renderMemory();
        } else if (gameId === 'flappy') {
          gameState.flappy = { y: 150, vy: 0, score: 0, pipes: [] };
          renderFlappy();
        }
      }

      function renderSnake() {
        const gameArea = document.getElementById('gameArea');
        gameArea.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'snake-grid';
        for (let y = 0; y < 10; y++) {
          for (let x = 0; x < 10; x++) {
            const cell = document.createElement('div');
            cell.className = 'snake-cell';
            if (gameState.snake.body.some(b => b[0] === x && b[1] === y)) cell.classList.add('snake');
            if (gameState.snake.food[0] === x && gameState.snake.food[1] === y) cell.classList.add('food');
            grid.appendChild(cell);
          }
        }
        gameArea.appendChild(grid);
        document.getElementById('gameScore').textContent = `Score: ${gameState.snake.score}`;
      }

      function updateSnake() {
        const head = [...gameState.snake.body[0]];
        head[0] += gameState.snake.direction[0];
        head[1] += gameState.snake.direction[1];

        if (head[0] < 0 || head[0] >= 10 || head[1] < 0 || head[1] >= 10 || 
            gameState.snake.body.some(b => b[0] === head[0] && b[1] === head[1])) {
          document.getElementById('gameScore').textContent = `Game Over! Final Score: ${gameState.snake.score}`;
          gameRunning = false;
          return;
        }

        gameState.snake.body.unshift(head);

        if (head[0] === gameState.snake.food[0] && head[1] === gameState.snake.food[1]) {
          gameState.snake.score += 10;
          gameState.snake.food = [Math.floor(Math.random() * 10), Math.floor(Math.random() * 10)];
        } else {
          gameState.snake.body.pop();
        }

        renderSnake();
      }

      function renderMemory() {
        const gameArea = document.getElementById('gameArea');
        gameArea.innerHTML = '';
        const grid = document.createElement('div');
        grid.className = 'memory-grid';
        gameState.memory.cards.forEach((card, i) => {
          const btn = document.createElement('button');
          btn.className = 'memory-card';
          if (gameState.memory.flipped[i]) btn.classList.add('flipped');
          btn.textContent = gameState.memory.flipped[i] ? card : '?';
          btn.onclick = () => flipMemoryCard(i);
          grid.appendChild(btn);
        });
        gameArea.appendChild(grid);
        document.getElementById('gameScore').textContent = `Matched: ${gameState.memory.matched}/8`;
      }

      function flipMemoryCard(i) {
        if (gameState.memory.flipped[i] || gameState.memory.flipped.filter(f => f).length >= 2) return;
        gameState.memory.flipped[i] = true;
        renderMemory();

        const flipped = gameState.memory.flipped.map((f, idx) => f ? idx : -1).filter(i => i >= 0);
        if (flipped.length === 2) {
          setTimeout(() => {
            if (gameState.memory.cards[flipped[0]] === gameState.memory.cards[flipped[1]]) {
              gameState.memory.matched++;
              if (gameState.memory.matched === 8) {
                document.getElementById('gameScore').textContent = 'You Won! 🎉';
                gameRunning = false;
              }
            } else {
              gameState.memory.flipped[flipped[0]] = false;
              gameState.memory.flipped[flipped[1]] = false;
            }
            renderMemory();
          }, 500);
        }
      }

      function renderFlappy() {
        const gameArea = document.getElementById('gameArea');
        gameArea.innerHTML = '';
        const bird = document.createElement('div');
        bird.className = 'flappy-bird';
        bird.style.top = gameState.flappy.y + 'px';
        gameArea.appendChild(bird);
        gameState.flappy.pipes.forEach(pipe => {
          const p = document.createElement('div');
          p.className = 'pipe';
          p.style.left = pipe.x + 'px';
          p.style.top = '0';
          p.style.height = pipe.gap + 'px';
          gameArea.appendChild(p);
          const p2 = document.createElement('div');
          p2.className = 'pipe';
          p2.style.left = pipe.x + 'px';
          p2.style.top = (pipe.gap + 80) + 'px';
          p2.style.height = (300 - pipe.gap - 80) + 'px';
          gameArea.appendChild(p2);
        });
      }

      function updateFlappy() {
        gameState.flappy.vy += 0.5;
        gameState.flappy.y += gameState.flappy.vy;

        if (gameState.flappy.y > 280 || gameState.flappy.y < 0) {
          document.getElementById('gameScore').textContent = `Game Over! Score: ${gameState.flappy.score}`;
          gameRunning = false;
          return;
        }

        gameState.flappy.pipes = gameState.flappy.pipes.filter(p => p.x > -60);
        if (gameState.flappy.pipes.length === 0 || gameState.flappy.pipes[gameState.flappy.pipes.length - 1].x < 200) {
          gameState.flappy.pipes.push({ x: 500, gap: Math.random() * 100 + 80 });
        }

        gameState.flappy.pipes.forEach(pipe => {
          if (pipe.x + 40 > 50 && pipe.x < 100) {
            if (gameState.flappy.y < pipe.gap || gameState.flappy.y + 40 > pipe.gap + 80) {
              document.getElementById('gameScore').textContent = `Game Over! Score: ${gameState.flappy.score}`;
              gameRunning = false;
              return;
            }
            if (pipe.x === 50) gameState.flappy.score += 1;
          }
          pipe.x -= 4;
        });

        document.getElementById('gameScore').textContent = `Score: ${gameState.flappy.score}`;
        renderFlappy();
      }

      function runGame(gameId) {
        gameRunning = true;
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(() => {
          if (!gameRunning) {
            clearInterval(gameLoop);
            return;
          }
          if (gameId === 'snake') updateSnake();
          else if (gameId === 'flappy') updateFlappy();
        }, gameId === 'snake' ? 200 : 50);
      }

      document.getElementById('openGamesBtn').addEventListener('click', showMenuOverlay);
      document.getElementById('menuBackBtn').addEventListener('click', () => {
        hideMenuOverlay();
        if (gameLoop) clearInterval(gameLoop);
      });
      document.getElementById('gameBackBtn').addEventListener('click', hideGameContainer);

      document.addEventListener('keydown', (e) => {
        if (currentGame === 'snake') {
          if (e.key === 'ArrowUp' && gameState.snake.direction[1] === 0) gameState.snake.direction = [0, -1];
          if (e.key === 'ArrowDown' && gameState.snake.direction[1] === 0) gameState.snake.direction = [0, 1];
          if (e.key === 'ArrowLeft' && gameState.snake.direction[0] === 0) gameState.snake.direction = [-1, 0];
          if (e.key === 'ArrowRight' && gameState.snake.direction[0] === 0) gameState.snake.direction = [1, 0];
        } else if (currentGame === 'flappy') {
          if (e.key === ' ' || e.key === 'Enter') gameState.flappy.vy = -10;
        }
      });

      document.getElementById('playBtn').addEventListener('click', (e) => {
        e.preventDefault();
        isPlaying = true;
        animationLoop();
      });

      document.getElementById('stopBtn').addEventListener('click', (e) => {
        e.preventDefault();
        isPlaying = false;
        currentFrame = 0;
        updateDisplay();
        draw();
      });

      document.getElementById('frameSlider').addEventListener('input', (e) => {
        currentFrame = Number(e.target.value);
        updateDisplay();
        draw();
      });

      document.getElementById('timelineBar').addEventListener('click', (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        currentFrame = Math.round(percent * totalFrames);
        updateDisplay();
        draw();
      });

      document.getElementById('setKeyframeBtn').addEventListener('click', (e) => {
        e.preventDefault();
        object.keyframes[currentFrame] = {
          x: Number(document.getElementById('posX').value),
          y: Number(document.getElementById('posY').value),
          size: Number(document.getElementById('size').value),
          rotation: Number(document.getElementById('rotation').value),
          opacity: Number(document.getElementById('opacity').value)
        };
        renderKeyframes();
        draw();
      });

      document.getElementById('clearAnimBtn').addEventListener('click', (e) => {
        e.preventDefault();
        object.keyframes = {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 }
        };
        currentFrame = 0;
        isPlaying = false;
        renderKeyframes();
        updateDisplay();
        draw();
      });

      document.getElementById('shapeType').addEventListener('change', (e) => {
        object.shapeType = e.target.value;
        draw();
      });

      document.getElementById('colorInput').addEventListener('input', (e) => {
        object.color = e.target.value;
        draw();
      });

      document.getElementById('posX').addEventListener('input', (e) => {
        document.getElementById('posXValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('posY').addEventListener('input', (e) => {
        document.getElementById('posYValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('size').addEventListener('input', (e) => {
        document.getElementById('sizeValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('rotation').addEventListener('input', (e) => {
        document.getElementById('rotationValue').textContent = e.target.value;
        draw();
      });

      document.getElementById('opacity').addEventListener('input', (e) => {
        document.getElementById('opacityValue').textContent = e.target.value;
        draw();
      });

      document.querySelectorAll('[data-preset]').forEach((button) => {
        button.addEventListener('click', () => applyPreset(button.dataset.preset));
      });

      document.getElementById('applyTimingBtn').addEventListener('click', () => {
        applyTiming();
      });

      syncTimingInputs();
      renderKeyframes();
      updateDisplay();
      draw();
    </script>
  </body>
</html>
