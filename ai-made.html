<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation Studio</title>
    <style>
      :root {
        --bg: #0a0e1a;
        --bg-2: #0f1420;
        --panel: rgba(15, 23, 42, 0.8);
        --line: rgba(148, 163, 184, 0.15);
        --text: #e2e8f0;
        --muted: #94a3b8;
        --purple: #8b5cf6;
        --cyan: #22d3ee;
        --green: #34d399;
        --shadow: rgba(0, 0, 0, 0.5);
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: Inter, "Segoe UI", monospace;
        background: linear-gradient(135deg, var(--bg), var(--bg-2));
        color: var(--text);
      }

      .studio {
        display: grid;
        grid-template-rows: 50px 1fr 120px;
        height: 100vh;
        gap: 1px;
        background: var(--line);
      }

      /* ===== TOP BAR ===== */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        background: var(--panel);
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        font-size: 0.85rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .brand-icon {
        width: 24px;
        height: 24px;
        border-radius: 6px;
        background: linear-gradient(135deg, var(--purple), var(--cyan));
        display: grid;
        place-items: center;
        color: white;
        font-size: 0.7rem;
      }

      .topbar-right {
        display: flex;
        align-items: center;
        gap: 14px;
        color: var(--muted);
        font-size: 0.8rem;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--green);
        box-shadow: 0 0 10px rgba(52, 211, 153, 0.8);
      }

      /* ===== MAIN WORKSPACE ===== */
      .workspace {
        display: grid;
        grid-template-columns: 280px 1fr 240px;
        gap: 1px;
        background: var(--line);
        overflow: hidden;
      }

      .sidebar, .inspector {
        background: var(--panel);
        overflow-y: auto;
        padding: 16px;
        border-right: 1px solid var(--line);
      }

      .inspector {
        border-right: none;
      }

      .panel-title {
        font-size: 0.75rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 12px 0;
        font-weight: 700;
      }

      .section {
        margin-bottom: 18px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line);
      }

      .section:last-child {
        border-bottom: none;
      }

      /* ===== SIDEBAR CONTROLS ===== */
      input[type="text"],
      input[type="range"],
      select {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(148, 163, 184, 0.06);
        color: var(--text);
        font-family: inherit;
        font-size: 0.85rem;
        margin-bottom: 10px;
      }

      input[type="range"] {
        accent-color: var(--purple);
      }

      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 6px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      button {
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(139, 92, 246, 0.12);
        color: var(--text);
        font-weight: 600;
        font-size: 0.8rem;
        cursor: pointer;
        transition: 0.15s ease;
        width: 100%;
        margin-bottom: 8px;
      }

      button:hover {
        transform: translateY(-1px);
        box-shadow: 0 8px 16px rgba(139, 92, 246, 0.2);
      }

      button:active {
        transform: translateY(0);
      }

      button.secondary {
        background: rgba(52, 211, 153, 0.08);
        border-color: rgba(52, 211, 153, 0.2);
      }

      /* ===== CANVAS AREA ===== */
      .canvas-area {
        display: grid;
        grid-template-rows: 1fr auto;
        background: linear-gradient(135deg, rgba(15, 23, 42, 0.6), rgba(11, 16, 26, 0.6));
        position: relative;
      }

      .canvas-viewport {
        position: relative;
        overflow: hidden;
        background: linear-gradient(180deg, rgba(30, 41, 59, 0.8), rgba(20, 28, 44, 0.8));
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* ===== TIMELINE ===== */
      .timeline {
        background: var(--panel);
        border-top: 1px solid var(--line);
        padding: 12px;
        max-height: 120px;
        overflow-y: auto;
      }

      .timeline-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .timeline-controls {
        display: flex;
        gap: 8px;
      }

      .play-btn {
        width: 32px !important;
        height: 32px !important;
        padding: 0 !important;
        margin: 0 !important;
        border-radius: 6px;
        display: grid;
        place-items: center;
        font-size: 0.7rem;
      }

      .timeline-bar {
        width: 100%;
        height: 3px;
        background: rgba(148, 163, 184, 0.1);
        border-radius: 2px;
        position: relative;
        cursor: pointer;
        margin-top: 8px;
      }

      .timeline-progress {
        height: 100%;
        background: linear-gradient(90deg, var(--purple), var(--cyan));
        border-radius: 2px;
        position: relative;
      }

      .timeline-progress::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 10px;
        background: white;
        border-radius: 50%;
        right: -5px;
        top: -3.5px;
        box-shadow: 0 2px 8px var(--shadow);
      }

      /* ===== KEYFRAME STRIP ===== */
      .keyframe-strip {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        padding: 8px 0;
        flex-wrap: wrap;
      }

      .keyframe {
        width: 24px;
        height: 24px;
        background: rgba(139, 92, 246, 0.2);
        border: 1px solid var(--line);
        border-radius: 4px;
        cursor: pointer;
        transition: 0.1s ease;
        font-size: 0.65rem;
        display: grid;
        place-items: center;
      }

      .keyframe:hover {
        background: rgba(139, 92, 246, 0.4);
      }

      .keyframe.active {
        background: var(--purple);
        border-color: var(--purple);
        box-shadow: 0 0 12px rgba(139, 92, 246, 0.6);
      }

      /* ===== INSPECTOR ===== */
      .property-row {
        margin-bottom: 14px;
      }

      .value-display {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .value-box {
        padding: 8px 10px;
        background: rgba(148, 163, 184, 0.08);
        border: 1px solid var(--line);
        border-radius: 6px;
        text-align: center;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .value-box strong {
        display: block;
        color: var(--text);
        font-size: 0.9rem;
        margin-bottom: 2px;
      }

      /* ===== GUIDE PANEL ===== */
      .guide {
        background: rgba(34, 211, 238, 0.06);
        border: 1px solid rgba(34, 211, 238, 0.15);
        border-radius: 8px;
        padding: 10px;
        font-size: 0.75rem;
        line-height: 1.5;
        color: #bae6fd;
        margin-bottom: 12px;
      }

      .guide-title {
        font-weight: 700;
        color: var(--cyan);
        margin-bottom: 6px;
      }

      @media (max-width: 1200px) {
        .workspace {
          grid-template-columns: 1fr;
        }

        .sidebar, .inspector {
          display: none;
        }
      }

      ::-webkit-scrollbar {
        width: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(148, 163, 184, 0.05);
      }

      ::-webkit-scrollbar-thumb {
        background: rgba(139, 92, 246, 0.3);
        border-radius: 4px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: rgba(139, 92, 246, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="studio">
      <!-- TOP BAR -->
      <header class="topbar">
        <div class="brand">
          <div class="brand-icon">▶</div>
          <span>Animation Studio</span>
        </div>
        <div class="topbar-right">
          <span class="status-dot"></span>
          <span>Ready to animate</span>
        </div>
      </header>

      <!-- MAIN WORKSPACE -->
      <div class="workspace">
        <!-- LEFT SIDEBAR -->
        <aside class="sidebar">
          <h3 class="panel-title">Objects</h3>

          <div class="section">
            <label>Name</label>
            <input type="text" id="objectName" value="Square" />
            <button class="secondary" id="addObjectBtn">+ New Object</button>
          </div>

          <h3 class="panel-title" style="margin-top: 18px;">Shape</h3>
          <div class="section">
            <label>Type</label>
            <select id="shapeType">
              <option>Square</option>
              <option>Circle</option>
              <option>Triangle</option>
              <option>Star</option>
            </select>
          </div>

          <h3 class="panel-title" style="margin-top: 18px;">Color</h3>
          <div class="section">
            <label>Fill</label>
            <input type="text" id="colorInput" value="#8b5cf6" />
          </div>

          <h3 class="panel-title" style="margin-top: 18px;">Animation Basics</h3>
          <div class="guide">
            <div class="guide-title">How to animate:</div>
            <div>
              1. Set a keyframe at start (frame 0)<br/>
              2. Move slider to frame 30<br/>
              3. Change position/size/color<br/>
              4. Set keyframe at frame 30<br/>
              5. Press PLAY
            </div>
          </div>

          <button id="clearAnimBtn">Clear Animation</button>
        </aside>

        <!-- CENTER CANVAS -->
        <div class="canvas-area">
          <div class="canvas-viewport">
            <canvas id="canvas"></canvas>
          </div>

          <!-- TIMELINE -->
          <div class="timeline">
            <div class="timeline-header">
              <h3 class="panel-title">Timeline</h3>
              <div class="timeline-controls">
                <button class="play-btn" id="playBtn">▶</button>
                <button class="play-btn" id="stopBtn">⏹</button>
              </div>
            </div>

            <div class="timeline-bar" id="timelineBar">
              <div class="timeline-progress" id="timelineProgress"></div>
            </div>

            <div class="keyframe-strip" id="keyframeStrip"></div>

            <div style="margin-top: 8px; display: flex; gap: 8px; align-items: center;">
              <label style="margin: 0; flex: 1;">Frame: <strong id="frameDisplay">0</strong> / 60</label>
              <input type="range" id="frameSlider" min="0" max="60" value="0" style="margin: 0; flex: 2;" />
            </div>
          </div>
        </div>

        <!-- RIGHT INSPECTOR -->
        <aside class="inspector">
          <h3 class="panel-title">Properties</h3>

          <div class="section">
            <label>Position X</label>
            <div class="value-display">
              <input type="range" id="posX" min="0" max="800" value="400" />
              <div class="value-box"><strong id="posXValue">400</strong>px</div>
            </div>
          </div>

          <div class="section">
            <label>Position Y</label>
            <div class="value-display">
              <input type="range" id="posY" min="0" max="400" value="200" />
              <div class="value-box"><strong id="posYValue">200</strong>px</div>
            </div>
          </div>

          <div class="section">
            <label>Size</label>
            <div class="value-display">
              <input type="range" id="size" min="10" max="200" value="60" />
              <div class="value-box"><strong id="sizeValue">60</strong>px</div>
            </div>
          </div>

          <div class="section">
            <label>Rotation</label>
            <div class="value-display">
              <input type="range" id="rotation" min="0" max="360" value="0" />
              <div class="value-box"><strong id="rotationValue">0</strong>°</div>
            </div>
          </div>

          <div class="section">
            <label>Opacity</label>
            <div class="value-display">
              <input type="range" id="opacity" min="0" max="100" value="100" />
              <div class="value-box"><strong id="opacityValue">100</strong>%</div>
            </div>
          </div>

          <button class="secondary" id="setKeyframeBtn">📌 Set Keyframe</button>
        </aside>
      </div>
    </div>

    <script>
      const canvas = document.getElementById('canvas');
      const ctx = canvas.getContext('2d');
      
      // Setup canvas size
      function resizeCanvas() {
        canvas.width = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Animation state
      let isPlaying = false;
      let currentFrame = 0;
      let totalFrames = 60;
      let animationSpeed = 1000 / 30; // 30 FPS

      // Object data
      let object = {
        name: 'Square',
        type: 'Square',
        color: '#8b5cf6',
        keyframes: {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 },
          30: { x: 200, y: 150, size: 80, rotation: 180, opacity: 100 },
          60: { x: 400, y: 200, size: 60, rotation: 360, opacity: 100 }
        }
      };

      // Interpolation
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function getInterpolatedValue(keyframes, frame) {
        const frames = Object.keys(keyframes).map(Number).sort((a, b) => a - b);
        
        let before = frames[0];
        let after = frames[frames.length - 1];

        for (let i = 0; i < frames.length - 1; i++) {
          if (frame >= frames[i] && frame <= frames[i + 1]) {
            before = frames[i];
            after = frames[i + 1];
            break;
          }
        }

        if (before === after) {
          return keyframes[before];
        }

        const t = (frame - before) / (after - before);
        const kf1 = keyframes[before];
        const kf2 = keyframes[after];

        return {
          x: lerp(kf1.x, kf2.x, t),
          y: lerp(kf1.y, kf2.y, t),
          size: lerp(kf1.size, kf2.size, t),
          rotation: lerp(kf1.rotation, kf2.rotation, t),
          opacity: lerp(kf1.opacity, kf2.opacity, t)
        };
      }

      // Draw function
      function drawFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const state = getInterpolatedValue(object.keyframes, currentFrame);

        ctx.save();
        ctx.globalAlpha = state.opacity / 100;
        ctx.translate(state.x, state.y);
        ctx.rotate((state.rotation * Math.PI) / 180);
        ctx.fillStyle = object.color;

        if (object.type === 'Square') {
          ctx.fillRect(-state.size / 2, -state.size / 2, state.size, state.size);
        } else if (object.type === 'Circle') {
          ctx.beginPath();
          ctx.arc(0, 0, state.size / 2, 0, Math.PI * 2);
          ctx.fill();
        } else if (object.type === 'Triangle') {
          ctx.beginPath();
          ctx.moveTo(0, -state.size / 2);
          ctx.lineTo(state.size / 2, state.size / 2);
          ctx.lineTo(-state.size / 2, state.size / 2);
          ctx.closePath();
          ctx.fill();
        } else if (object.type === 'Star') {
          drawStar(0, 0, state.size / 2);
        }

        ctx.restore();
      }

      function drawStar(cx, cy, r) {
        let points = 5;
        let angle = (Math.PI * 2) / points;
        ctx.beginPath();
        for (let i = 0; i < points * 2; i++) {
          const radius = i % 2 === 0 ? r : r * 0.5;
          const x = cx + Math.cos(i * angle - Math.PI / 2) * radius;
          const y = cy + Math.sin(i * angle - Math.PI / 2) * radius;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.fill();
      }

      // Animation loop
      function animate() {
        drawFrame();
        
        if (isPlaying) {
          currentFrame += 1;
          if (currentFrame > totalFrames) {
            currentFrame = 0;
          }
          updateUI();
          setTimeout(animate, animationSpeed);
        } else {
          drawFrame();
        }
      }

      // Update UI
      function updateUI() {
        document.getElementById('frameDisplay').textContent = currentFrame;
        document.getElementById('frameSlider').value = currentFrame;
        document.getElementById('timelineProgress').style.width = (currentFrame / totalFrames) * 100 + '%';

        const state = getInterpolatedValue(object.keyframes, currentFrame);
        document.getElementById('posXValue').textContent = Math.round(state.x);
        document.getElementById('posYValue').textContent = Math.round(state.y);
        document.getElementById('sizeValue').textContent = Math.round(state.size);
        document.getElementById('rotationValue').textContent = Math.round(state.rotation);
        document.getElementById('opacityValue').textContent = Math.round(state.opacity);
      }

      function renderKeyframes() {
        const strip = document.getElementById('keyframeStrip');
        strip.innerHTML = '';
        
        for (let i = 0; i <= totalFrames; i += 5) {
          const kf = document.createElement('button');
          kf.className = 'keyframe' + (object.keyframes[i] ? ' active' : '');
          kf.textContent = i;
          kf.onclick = () => {
            currentFrame = i;
            updateUI();
            drawFrame();
          };
          strip.appendChild(kf);
        }
      }

      // Event listeners
      document.getElementById('playBtn').addEventListener('click', () => {
        isPlaying = !isPlaying;
        animate();
      });

      document.getElementById('stopBtn').addEventListener('click', () => {
        isPlaying = false;
        currentFrame = 0;
        updateUI();
        drawFrame();
      });

      document.getElementById('frameSlider').addEventListener('input', (e) => {
        currentFrame = Number(e.target.value);
        updateUI();
        drawFrame();
      });

      document.getElementById('setKeyframeBtn').addEventListener('click', () => {
        object.keyframes[currentFrame] = {
          x: Number(document.getElementById('posX').value),
          y: Number(document.getElementById('posY').value),
          size: Number(document.getElementById('size').value),
          rotation: Number(document.getElementById('rotation').value),
          opacity: Number(document.getElementById('opacity').value)
        };
        renderKeyframes();
        drawFrame();
      });

      document.getElementById('shapeType').addEventListener('change', (e) => {
        object.type = e.target.value;
        drawFrame();
      });

      document.getElementById('colorInput').addEventListener('change', (e) => {
        object.color = e.target.value;
        drawFrame();
      });

      document.getElementById('posX').addEventListener('input', (e) => {
        document.getElementById('posXValue').textContent = e.target.value;
        drawFrame();
      });

      document.getElementById('posY').addEventListener('input', (e) => {
        document.getElementById('posYValue').textContent = e.target.value;
        drawFrame();
      });

      document.getElementById('size').addEventListener('input', (e) => {
        document.getElementById('sizeValue').textContent = e.target.value;
        drawFrame();
      });

      document.getElementById('rotation').addEventListener('input', (e) => {
        document.getElementById('rotationValue').textContent = e.target.value;
        drawFrame();
      });

      document.getElementById('opacity').addEventListener('input', (e) => {
        document.getElementById('opacityValue').textContent = e.target.value;
        drawFrame();
      });

      document.getElementById('clearAnimBtn').addEventListener('click', () => {
        object.keyframes = {
          0: { x: 400, y: 200, size: 60, rotation: 0, opacity: 100 }
        };
        renderKeyframes();
        drawFrame();
      });

      document.getElementById('timelineBar').addEventListener('click', (e) => {
        const rect = e.target.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const percent = x / rect.width;
        currentFrame = Math.round(percent * totalFrames);
        updateUI();
        drawFrame();
      });

      // Initial render
      renderKeyframes();
      updateUI();
      drawFrame();
    </script>
  </body>
</html>
